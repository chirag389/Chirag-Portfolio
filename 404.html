<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Chirag Mahajan</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  try { var t = localStorage.getItem('cm-portfolio-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
  :root { --bg:#FCFCFC; --ink:#020520; --muted:#374151; --line:#E2E8F0; --accent:#145AFF; --wash:#F0F4FE; }
  html[data-theme="dark"] { --bg:#030303; --ink:#F5F5F7; --muted:#A6A6B0; --line:rgba(255,255,255,.14); --accent:#FFFFFF; --wash:#111116; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:linear-gradient(180deg, var(--bg) 0%, var(--wash) 100%); color:var(--ink);
    font-family:'Inter', system-ui, sans-serif; -webkit-font-smoothing:antialiased; text-align:center; }
  main { max-width:520px; }
  .code { font-size:14px; font-weight:500; color:var(--muted); }
  h1 { font-size:clamp(34px,6vw,52px); line-height:1.05; letter-spacing:-.03em; font-weight:600; margin:10px 0 14px; }
  p { font-size:17px; line-height:1.6; color:var(--muted); margin:0 0 30px; }
  a { display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:999px; border:1px solid var(--accent);
    color:var(--accent); text-decoration:none; font-weight:600; font-size:15px; }
  a:hover { background:var(--wash); }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>This page doesn’t exist.</h1>
  <p>The link may be old or mistyped. The homepage has my work, case studies and contact details.</p>
  <a id="home" href="/">Go to the homepage</a>
</main>
<script>
  /* GitHub Pages project sites live under /<repo>/, user sites at /.
     Point the button at whichever one actually has the homepage. */
  (function () {
    var link = document.getElementById('home');
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (!seg || !/\.github\.io$/.test(location.hostname)) return;
    var candidate = '/' + seg + '/';
    fetch(candidate + 'index.html', { method: 'HEAD' })
      .then(function (r) { if (r.ok) link.href = candidate; })
      .catch(function () {});
  })();
</script>
</body>
</html>
